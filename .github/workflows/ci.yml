name: CI

on:
  push:
    branches: [main]
    tags-ignore: ['v*']  # Don't run CI on tag pushes — Publish workflow handles that
  pull_request:
    branches: [main]

# Supersede in-flight runs when new commits land on the same ref — avoids
# redundant duplicate runs during rapid pushes (e.g. feature push + version bump).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:a11y
      - run: npm run test:bundle-size
