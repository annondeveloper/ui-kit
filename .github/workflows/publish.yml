name: Publish

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Generate changelog
        run: node scripts/generate-changelog.js || echo "Changelog generation skipped"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  create-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        run: gh release create "$TAG_NAME" --generate-notes || echo "Release already exists"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}

  # npm — trusted publishing via OIDC provenance
  # Requires: npmjs.com > Package Settings > Publishing access > Link GitHub repo
  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for npm provenance / trusted publishing
    environment:
      name: npm
      url: https://www.npmjs.com/package/@annondeveloper/ui-kit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # Remove .npmrc that points to GitHub Packages — we want public npm here
      - name: Configure for public npm
        run: |
          rm -f .npmrc
          echo "//registry.npmjs.org/:_authToken=\${NODE_AUTH_TOKEN}" > .npmrc
          echo "registry=https://registry.npmjs.org/" >> .npmrc
      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.GITHUB_TOKEN }}

  # GitHub Packages — uses GITHUB_TOKEN (automatic)
  publish-github:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          scope: '@annondeveloper'
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to GitHub Packages
        run: npm publish || echo "Version already exists on GitHub Packages"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # JSR — trusted publishing via OIDC (no token needed)
  # Requires: jsr.io > Package Settings > Link GitHub repo
  publish-jsr:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for JSR trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # Guard against the version-desync failure mode: `jsr publish` silently
      # logs "Skipping, already published" (exit 0) when jsr.json lags
      # package.json, leaving JSR a release behind while the job stays green.
      # Fail loudly instead.
      - name: Verify jsr.json version matches package.json
        run: |
          PKG=$(node -p "require('./package.json').version")
          JSR=$(node -p "require('./jsr.json').version")
          if [ "$PKG" != "$JSR" ]; then
            echo "::error::Version desync: package.json=$PKG but jsr.json=$JSR — the version lifecycle script must sync jsr.json"
            exit 1
          fi
          echo "Versions in sync: $PKG"
      - run: npx jsr publish --allow-dirty --allow-slow-types
